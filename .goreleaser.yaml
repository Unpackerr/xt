# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    ## This creates MANUAL and MANUAL.html. The gzip then makes MANUAL.gz (a man page).
    - go run github.com/davidnewhall/md2roff@v0.0.1 --manual xt --version "{{.Version}}-{{.Env.REVISION}}" --date "{{.Date}}" MANUAL.md
    - rm -f MANUAL.gz
    - gzip -9 MANUAL
    # Icon + manifest + VERSIONINFO (Explorer File version). -platform-specific:
    # Windows is amd64/386/arm64; a single amd64 .syso would miss the others.
    # FileVersion is the x.y.z prefix of .Version plus REVISION (not .RawVersion:
    # that stays on the last tag if --nightly is ever used). ProductVersion is
    # .Version. goversioninfo fills the numeric fields from the FileVersion string.
    - >-
      go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
      -platform-specific
      -icon init/windows/application.ico
      -manifest init/windows/manifest.xml
      -company "Go Lift"
      -copyright "© Go Lift (https://golift.io)"
      -description "eXtractor Tool - Recursively decompress archives"
      -internal-name xt
      -original-name xt.exe
      -product-name xt
      -file-version "{{ index (split .Version "-") 0 }}.{{ .Env.REVISION }}"
      -product-version "{{ .Version }}"
      -translation 1033
      -charset 1200

builds:
  - id: xt
    env:
      - CGO_ENABLED=0
      - CGO_LDFLAGS=-mmacosx-version-min=10.8
      - CGO_CFLAGS=-mmacosx-version-min=10.8
    goos:
      - linux
      - windows
      - freebsd
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
      - '386'
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{.Version}}"
      - -X "golift.io/version.BuildDate={{.Date}}"
      - -X "golift.io/version.BuildUser={{.Env.USER}}"
      - -X "golift.io/version.Revision={{.Env.REVISION}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: '386'
    hooks:
      post:
        - cmd: bash init/windows/signexe.sh "{{ .Path }}"
          if: '{{ eq .Os "windows" }}'

universal_binaries:
  - id: xt
    replace: true

# Sign + notarize the macOS universal binary (quill; works on Linux CI).
# Enabled only when MACOS_SIGN_P12 is set so local snapshots still work.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - xt
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: ['tar.gz']
    # Flat so the Homebrew cask can find the binary without a rename.
    wrap_in_directory: false
    files:
     - src: MANUAL.html
       dst: xt-manual.html
     - src: LICENSE
       dst: LICENSE.txt
    format_overrides:
      - goos: windows
        formats: ['zip']

nfpms:
  - id: xt-packages
    vendor: Go Lift
    homepage: https://unpackerr.com
    maintainer: David Newhall II <captain at golift dot io>
    description: eXtractor Tool - Recursively decompress archives
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
      - apk
    bindir: /usr/bin
    version_metadata: git
    section: default
    priority: extra
    provides:
      - xt
    rpm:
      signature:
        key_file: "{{ .Env.GPG_SIGNING_KEY }}"
    deb:
      signature:
        key_file: "{{ .Env.GPG_SIGNING_KEY }}"
        type: origin
    contents:
      - src: MANUAL.gz
        dst: /usr/share/man/man1/xt.1.gz
      - src: LICENSE
        dst: /usr/share/doc/xt/LICENSE.txt
      - src: MANUAL.md
        dst: /usr/share/doc/xt/MANUAL.md

signs:
    - artifacts: all

homebrew_casks:
  - name: xt
    binaries:
      - xt
    repository:
      owner: golift
      name: homebrew-mugs
      branch: master
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    homepage: https://unpackerr.com/
    description: "eXtractor Tool - Recursively decompress archives"
    license: MIT
    url:
      template: "https://github.com/Unpackerr/xt/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      verified: github.com/Unpackerr/xt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
